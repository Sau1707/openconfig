name: Scoped OpenCode cleanup

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        description: 'OpenAI API key for the cleanup agent'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: repository
        shell: bash
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false

      - name: Initialize cleanup
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CLEANUP_REPORT=$RUNNER_TEMP/cleanup-report.md" >> "$GITHUB_ENV"

      - name: Check for an existing cleanup PR
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh pr list --state open --head automation/opencode-cleanup --json number --jq 'length')
          if [[ "$count" != 0 ]]; then
            echo 'A cleanup PR is already awaiting review; skipping.' >> "$GITHUB_STEP_SUMMARY"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenCode and configuration
        if: steps.pending.outputs.skip != 'true'
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          export PATH="$HOME/.opencode/bin:$PATH"
          git clone --branch main https://github.com/Sau1707/openconfig.git "$HOME/.config/opencode"
          opencode --version

      - name: Implement scoped cleanup
        if: steps.pending.outputs.skip != 'true'
        timeout-minutes: 35
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY secret.'; exit 1; }
          opencode run --standalone --auto --agent loop "$(cat <<'PROMPT'
          Perform one unattended cleanup iteration using the cleanup skill.
          Follow the repository's AGENTS.md instructions. Inspect the directory
          structure and randomly choose one bounded feature, source folder, or
          subfolder to review. Do not use recent commits to select it. Exclude
          dependencies, generated files, assets, and configuration directories.
          Commit to that scope before searching for cleanup opportunities; do not
          perform a broad whole-repository review.

          First map this feature's entry points, workflow, state ownership,
          dependencies, callers, contracts, and tests. Follow references outside
          the folder to establish safety, but do not scan unrelated features.
          Investigate meaningful conceptual simplifications, not syntax churn.

          Identify up to five candidates and assess each one's confidence.
          For this unattended run, the user authorizes implementation of only
          high-confidence, behavior-preserving candidates. Do not wait for item
          selection, ask questions, or repeat the loop. Fewer than five or no
          findings is fine. Skip anything with unresolved compatibility concerns.
          Keep changes centered on this feature; update directly affected callers
          and tests when necessary. Do not upgrade dependencies, change schemas,
          alter public behavior, edit .github, commit, push, or create a PR.

          Implement the smallest complete changes. Run the relevant checks and
          inspect the final diff. If a candidate cannot be safely completed and
          verified, remove only your own changes for that candidate.

          Write a Markdown PR report to the absolute path in CLEANUP_REPORT,
          outside the repository. Include the selected scope, exploration summary,
          each implemented finding's exact paths/lines, evidence of redundancy,
          smallest complete change, benefit, preserved invariants, confidence,
          and actual verification results. Note skipped candidates and uncertainty.
          If nothing qualifies, report that explicitly and leave no source changes.
          Do not include secrets or raw environment output in the report.
          PROMPT
          )"

      - name: Validate the resulting changes
        if: steps.pending.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          test -s "$CLEANUP_REPORT"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only', '-z'])
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'])
          for path in (changed + untracked).decode().split('\0'):
              if path == '.github' or path.startswith('.github/'):
                  raise SystemExit('Cleanup must not modify GitHub Actions configuration.')
          PY
          git diff --check HEAD

      - name: Create cleanup pull request
        if: steps.pending.outputs.skip != 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          path: repository
          base: ${{ github.event.repository.default_branch }}
          branch: automation/opencode-cleanup
          commit-message: 'refactor: scoped OpenCode cleanup'
          title: 'refactor: scoped OpenCode cleanup'
          body-path: ${{ env.CLEANUP_REPORT }}
